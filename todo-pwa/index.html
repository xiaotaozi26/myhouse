<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf8f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>cc自传 · 待办提醒</title>
<style>
  :root{
    --bg:#fdf8f1; --bg2:#fffaf3; --card:rgba(255,253,248,.93);
    --line:rgba(180,140,105,.20); --txt:#4b3a30; --dim:#9b8778;
    --orange:#e08a5b; --coral:#e8a08c; --green:#7aa981; --gold:#e9b96e;
    --radius:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    background:
      radial-gradient(900px 520px at 8% -10%,rgba(255,216,176,.55),transparent 62%),
      radial-gradient(760px 520px at 100% 0%,rgba(240,192,178,.38),transparent 60%),
      linear-gradient(180deg,var(--bg),#f7ede1 78%);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:520px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(84px + env(safe-area-inset-bottom));}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
  .brand{font-size:25px;font-weight:800;letter-spacing:1px;line-height:1.15;
    background:linear-gradient(92deg,#c9744d,#dfa06d 58%,#cf8b86);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .date{font-size:13px;color:var(--dim);margin-top:6px}
  .clock{font-variant-numeric:tabular-nums;text-align:right;flex-shrink:0}
  .clock b{display:block;font-size:26px;line-height:1;letter-spacing:1px;color:#5a4335}
  .clock span{font-size:12px;color:var(--dim)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:0 8px 26px rgba(150,110,80,.10),inset 0 1px 0 rgba(255,255,255,.75);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .now{padding:16px 16px 14px;position:relative;overflow:hidden;margin-bottom:12px}
  .now::after{content:"";position:absolute;right:-30px;top:-40px;width:160px;height:160px;
    background:radial-gradient(circle,rgba(255,209,160,.42),transparent 70%);pointer-events:none}
  .now .label{font-size:12px;letter-spacing:2px;color:#c1774f;font-weight:700}
  .now h2{margin:7px 0 4px;font-size:28px;font-weight:800;color:#4b3a30}
  .now p{margin:0;font-size:13px;color:var(--dim)}
  .now .bar{height:5px;margin-top:14px;border-radius:9px;background:rgba(180,140,105,.14);overflow:hidden}
  .now .bar i{display:block;height:100%;border-radius:9px;
    background:linear-gradient(90deg,#edb47f,#e08a5b,#dc9a94);transition:width .5s}

  .notice{padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .notice .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);
    box-shadow:0 0 0 4px rgba(233,185,110,.20);flex-shrink:0}
  .notice.on .dot{background:var(--green);box-shadow:0 0 0 4px rgba(122,169,129,.16)}
  .notice .txt{flex:1;min-width:0}
  .notice .txt b{display:block;font-size:14px}
  .notice .txt small{display:block;font-size:12px;color:var(--dim);margin-top:2px}
  button{font:inherit;cursor:pointer;border:0;color:inherit}
  .btn{padding:8px 12px;border-radius:11px;font-size:13px;font-weight:700;white-space:nowrap;
    background:#fff4e8;border:1px solid rgba(224,138,91,.34);color:#a45e39;
    transition:transform .15s,filter .15s}
  .btn:active{transform:scale(.96)}
  .btn:hover{filter:brightness(1.04)}
  .btn.ghost{background:rgba(255,255,255,.62);border-color:var(--line);color:#8c796b}
  .btn.solid{background:linear-gradient(120deg,#e8a86f,#dc875c);color:#fffdf9;border:0;
    box-shadow:0 4px 12px rgba(200,120,75,.18)}

  .composer{padding:14px;margin-bottom:14px}
  .section-t{font-size:13px;font-weight:800;letter-spacing:1px;color:var(--dim);margin-bottom:11px;
    display:flex;align-items:center;gap:8px}
  .section-t::before{content:"";width:3px;height:13px;border-radius:3px;
    background:linear-gradient(#e8a86f,#dc875c)}
  input,select,textarea{
    width:100%;background:#fffdf9;border:1px solid rgba(180,140,105,.24);color:var(--txt);
    border-radius:11px;padding:11px 12px;font-size:15px;outline:none;appearance:none;
  }
  input:focus,select:focus,textarea:focus{border-color:rgba(224,138,91,.55);
    box-shadow:0 0 0 3px rgba(224,138,91,.10)}
  input::placeholder{color:#b4a294}
  select{background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239b8778' stroke-width='2.5'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:right 12px center;padding-right:32px}
  option{background:#fffaf3;color:#4b3a30}
  .row{display:flex;gap:8px}
  .row>*{min-width:0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .spacer{height:9px}
  .week-picker{border:0;margin:10px 0 0;padding:0;min-width:0}
  .week-picker legend{padding:0 0 6px;font-size:13px;color:#765b4b}
  .week-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
  .week-days label{position:relative;text-align:center}
  .week-days input{position:absolute;inset:0;height:100%;margin:0;opacity:0;cursor:pointer}
  .week-days span{display:block;padding:9px 0;border:1px solid var(--line);border-radius:10px;color:#765b4b;font-size:14px}
  .week-days input:checked+span{background:#f4d8c1;border-color:#d8a27f;color:#75402b;font-weight:750}
  .week-days input:focus-visible+span{outline:2px solid #a45e39;outline-offset:2px}
  .actions{display:flex;gap:8px;margin-top:11px}
  .actions .btn{flex:1;text-align:center;padding:11px}

  .filters{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .chip{padding:7px 12px;border-radius:20px;font-size:13px;white-space:nowrap;
    background:rgba(255,255,255,.62);border:1px solid rgba(180,140,105,.20);color:#8c796b}
  .chip.active{background:#fff0e2;border-color:rgba(224,138,91,.42);color:#a45e39}

  .task{padding:12px 13px;display:flex;align-items:center;gap:11px;margin-bottom:8px;position:relative;
    transition:opacity .2s,border-color .2s}
  .task.done{opacity:.55}
  .task.done .t-title{text-decoration:line-through}
  .check{width:21px;height:21px;border-radius:7px;border:1.5px solid rgba(224,138,91,.60);
    background:#fff6ed;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:14px;color:#fff;font-weight:900;padding:0}
  .task.done .check{background:var(--green);border-color:var(--green)}
  .t-main{flex:1;min-width:0}
  .t-title{font-size:15px;font-weight:700;line-height:1.35;word-break:break-word}
  .t-meta{font-size:12px;color:var(--dim);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
  .t-meta em{font-style:normal;color:#c1774f;font-variant-numeric:tabular-nums}
  .t-meta .once{color:#c08a4e}
  .del{background:transparent;color:#b6a597;font-size:19px;line-height:1;padding:4px 6px;flex-shrink:0}
  .del:hover{color:#c96f5b}
  .empty{padding:30px 16px;text-align:center;color:var(--dim);font-size:14px;line-height:1.8}
  .empty b{display:block;color:#6d5748;font-size:16px;margin-bottom:4px}

  footer{margin-top:18px;padding:0 4px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
  footer .stat{font-size:13px;color:var(--dim)}
  footer .stat b{color:#c1774f;font-size:16px}
  .foot-btns{display:flex;gap:7px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:130;
    background:#fffbf5;border:1px solid rgba(224,138,91,.35);color:#5a4335;
    padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;
    transition:opacity .25s,transform .25s;box-shadow:0 8px 28px rgba(120,80,50,.16)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.show:has(button){pointer-events:auto;display:flex;align-items:center;gap:10px}
  .toast button{background:transparent;color:#944724;text-decoration:underline;padding:4px}
  .modal-mask{position:fixed;inset:0;z-index:120;background:rgba(75,58,48,.32);
    display:flex;align-items:center;justify-content:center;padding:24px;
    opacity:0;pointer-events:none;transition:opacity .2s}
  .modal-mask.show{opacity:1;pointer-events:auto}
  .modal{width:100%;max-width:320px;background:#fffaf3;border:1px solid rgba(224,138,91,.28);
    border-radius:18px;padding:22px 20px 18px;text-align:center;
    box-shadow:0 16px 44px rgba(120,80,50,.22);transform:scale(.94);transition:transform .2s}
  .modal-mask.show .modal{transform:scale(1)}
  .modal .m-icon{width:44px;height:44px;border-radius:50%;background:#fdf0e2;color:#c1774f;
    font-size:24px;font-weight:800;line-height:44px;margin:0 auto 12px}
  .modal .m-title{font-size:17px;font-weight:800;color:#4b3a30;margin-bottom:7px}
  .modal .m-text{font-size:14px;color:#9b8778;line-height:1.65;margin-bottom:20px}
  .modal .m-btns{display:flex;gap:10px}
  .modal .m-btns .btn{flex:1;padding:11px;text-align:center}
  .hidden{display:none !important}

  .page{display:none}
  .page.active{display:block}
  .tabbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;
    display:flex;background:rgba(255,250,243,.97);border-top:1px solid rgba(180,140,105,.20);
    box-shadow:0 -6px 24px rgba(120,80,50,.08);z-index:100;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    background:transparent;color:#a99a8b;font-size:12px;padding:6px 2px;border-radius:11px}
  .tab .ti{font-size:20px;line-height:1;filter:grayscale(1);opacity:.6}
  .tab.active{color:#c1774f}
  .tab.active .ti{filter:none;opacity:1}
  .tab.locked{opacity:.62}
  .app{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .ph-card{padding:30px 20px;text-align:center}
  .ph-card .ph-ic{font-size:42px;line-height:1;margin-bottom:14px;opacity:.85}
  .ph-card h3{font-size:17px;margin:0 0 8px;color:#6d5748}
  .ph-card p{font-size:13px;color:var(--dim);line-height:1.75;margin:0}
  .ph-badge{display:inline-block;margin-top:14px;padding:5px 12px;border-radius:16px;
    background:#fff0e2;color:#a45e39;font-size:12px;font-weight:700}
  .profile-card{padding:18px 16px;margin-bottom:12px}
  .profile-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;
    border:3px solid #f3ddc8;flex-shrink:0;background:#fdf3e6}
  .avatar-ph{width:64px;height:64px;border-radius:50%;background:#fdf0e2;color:#c1774f;
    font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .profile-head .nm{font-size:19px;font-weight:800;color:#4b3a30}
  .profile-head .sb{font-size:13px;color:var(--dim);margin-top:4px}
  .tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
  .tagpill{padding:4px 10px;border-radius:14px;background:#fff0e2;color:#a45e39;font-size:12px}
  .field{margin-bottom:11px}
  .field label{display:block;font-size:13px;color:#9b8778;margin-bottom:5px}
  .field .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .savebar{margin-top:6px}

  .finance{padding:16px}
  .finance .fh{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .finance .fh .fi{font-size:24px}
  .finance .fh b{font-size:16px;color:#4b3a30}

  /* AI assistant */
  .ai-fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:70;
    width:52px;height:52px;border-radius:50%;border:1px solid rgba(224,138,91,.46);
    background:linear-gradient(135deg,#e8a86f,#dc875c);color:#fffdf9;font-size:23px;font-weight:800;
    box-shadow:0 8px 24px rgba(200,120,75,.34);display:flex;align-items:center;justify-content:center;
    transition:transform .18s}
  .ai-fab:active{transform:scale(.92)}
  .ai-fab.hidden{display:none}
  .ai-panel{position:fixed;inset:0;z-index:115;background:#fdf8f1;display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  .ai-panel.hidden{display:none}
  .ai-head{display:flex;align-items:center;gap:9px;padding:12px 14px;background:rgba(255,250,243,.97);
    border-bottom:1px solid var(--line);flex-shrink:0}
  .ai-head .ai-logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#e8a86f,#dc875c);
    color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;flex-shrink:0}
  .ai-head .ai-t{flex:1;min-width:0}
  .ai-head .ai-t b{display:block;font-size:16px;color:#4b3a30}
  .ai-head button{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:10px;
    padding:8px 10px;font-size:13px;font-weight:700;color:#8c796b;flex-shrink:0}
  .ai-msgs{flex:1;overflow-y:auto;padding:14px 14px 8px;-webkit-overflow-scrolling:touch}
  .ai-msg{display:flex;gap:8px;margin-bottom:12px;align-items:flex-start}
  .ai-msg.user{flex-direction:row-reverse}
  .ai-av{width:30px;height:30px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;
    justify-content:center;font-size:15px;font-weight:800}
  .ai-msg.bot .ai-av{background:linear-gradient(135deg,#e8a86f,#dc875c);color:#fff}
  .ai-msg.user .ai-av{background:#f3e6d9;color:#a45e39}
  .ai-bubble{max-width:78%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.65;word-break:break-word}
  .ai-msg.bot .ai-bubble{background:#fffdf7;border:1px solid var(--line);color:#4b3a30;border-top-left-radius:4px}
  .ai-msg.user .ai-bubble{background:linear-gradient(135deg,#e8a86f,#dc875c);color:#fffdf9;border-top-right-radius:4px}
  .ai-act{margin-top:7px;font-size:12px;color:var(--green);font-weight:700}
  .ai-quick{display:flex;gap:7px;overflow-x:auto;padding:8px 14px;scrollbar-width:none;flex-shrink:0}
  .ai-quick::-webkit-scrollbar{display:none}
  .ai-quick button{flex:0 0 auto;padding:8px 12px;border-radius:18px;background:#fffaf2;
    border:1px solid rgba(224,138,91,.3);color:#a45e39;font-size:13px;font-weight:700}
  .ai-input{display:flex;gap:8px;align-items:flex-end;padding:10px 14px 14px;background:rgba(255,250,243,.97);
    border-top:1px solid var(--line);flex-shrink:0}
  .ai-input textarea{flex:1;min-height:44px;max-height:110px;resize:none;border-radius:13px;font-size:14px;line-height:1.5}
  .ai-send{width:46px;height:44px;border-radius:13px;flex-shrink:0;background:linear-gradient(135deg,#e8a86f,#dc875c);
    color:#fffdf9;font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .ai-send:disabled{opacity:.5}
  .typing i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#d9b89a;margin:0 2px;animation:tp 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes tp{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  .fin-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}
  .fin-card{background:#fffaf2;border:1px solid var(--line);border-radius:14px;padding:13px}
  .fin-head{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .fin-head span{font-size:14px;font-weight:800;color:#4b3a30}
  .fin-edit{background:transparent;color:#a45e39;font-size:12px;font-weight:700;padding:3px 5px}
  .fin-lb{font-size:11px;color:var(--dim);margin-top:11px}
  .fin-hold{font-size:19px;font-weight:800;color:#5a4335;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.2}
  .fin-daily{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:9px}
  .fin-form{margin-top:11px}
  .fin-form input{font-size:13px;padding:9px;margin-bottom:6px}
  .fin-form .mbtn{width:100%;padding:9px;font-size:13px}

  .dash{padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
  .dash::after{content:"";position:absolute;right:-30px;top:-40px;width:160px;height:160px;
    background:radial-gradient(circle,rgba(255,209,160,.42),transparent 70%);pointer-events:none}
  .dash-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .weather{display:flex;align-items:center;gap:10px}
  .weather .wicon{font-size:36px;line-height:1;color:#d9865b}
  .weather .wtemp{font-size:30px;font-weight:800;color:#4b3a30;line-height:1.05}
  .weather .wtemp small{font-size:15px;font-weight:600}
  .weather .wdesc{font-size:12px;color:var(--dim);margin-top:3px}
  .dash-clock{text-align:right}
  .dash-clock b{display:block;font-size:28px;line-height:1;color:#5a4335;font-variant-numeric:tabular-nums}
  .dash-clock span{font-size:12px;color:var(--dim);margin-top:4px;display:block}
  .dash-next{margin-top:14px;padding-top:12px;border-top:1px solid rgba(180,140,105,.18)}
  .dash-next .nl{font-size:12px;letter-spacing:1px;color:#c1774f;font-weight:700}
  .dash-next .nt{font-size:16px;font-weight:800;color:#4b3a30;margin-top:5px;line-height:1.35}
  .dash-next .nm{font-size:12px;color:var(--dim);margin-top:4px}

  .set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 2px}
  .set-info b{display:block;font-size:15px;color:#4b3a30}
  .set-info small{display:block;font-size:12px;color:var(--dim);margin-top:3px;line-height:1.5}
  .ios-switch{width:50px;height:30px;border-radius:16px;background:#e6ded6;border:0;
    position:relative;flex-shrink:0;transition:background .25s;padding:0}
  .ios-switch .knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
    background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18);transition:transform .25s}
  .ios-switch.on{background:#7aa981}
  .ios-switch.on .knob{transform:translateX(20px)}

  .notes-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}
  .notes-count{font-size:13px;color:var(--dim);white-space:nowrap}
  .note-list{display:flex;flex-direction:column;gap:10px}
  .note-item{padding:14px 15px;display:flex;gap:11px;align-items:flex-start}
  .note-item .ni-main{flex:1;min-width:0}
  .note-item .ni-title{font-size:16px;font-weight:800;color:#4b3a30;line-height:1.4;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .note-item .ni-desc{font-size:13px;color:var(--dim);margin-top:6px;line-height:1.6;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .note-item .ni-date{font-size:12px;color:#b4a294;margin-top:8px}
  .note-item .ni-thumb{width:54px;height:54px;border-radius:10px;object-fit:cover;
    border:1px solid var(--line);background:#fffdf9;flex-shrink:0}
  .note-item .ni-del{background:transparent;color:#b6a597;font-size:20px;line-height:1;padding:2px 5px;flex-shrink:0}
  .notes-empty{padding:42px 18px;text-align:center;color:var(--dim);font-size:14px;line-height:1.9}
  .notes-empty b{display:block;color:#6d5748;font-size:16px;margin-bottom:5px}

  .note-editor{position:fixed;inset:0;z-index:110;background:#fffdf7;display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  .note-editor.hidden{display:none !important}
  .ne-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;

<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script>
(function(){
  'use strict';
  var KEY='todo-pwa-state-v1';
  var WEEK=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  var WEEKDAY_ORDER=[1,2,3,4,5,6,0];
  var $=function(id){return document.getElementById(id)};
  var filter='all', editingId=null, deferredPrompt=null, lastDay='', toastTimer=null;
  var lastWarnAt=0;

  function pad(n){return n<10?'0'+n:''+n}
  function dayKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function hm(d){return pad(d.getHours())+':'+pad(d.getMinutes())}
  function defaultState(){
    return {tasks:[
      {id:'demo1',title:'拆解今天最重要的 3 件事',time:'09:30',repeat:'daily',date:'',note:'先做最难的那件',enabled:true,notified:[],demo:true},
      {id:'demo2',title:'推进一个项目 30 分钟',time:'14:30',repeat:'daily',date:'',note:'专注，不看消息',enabled:true,notified:[],demo:true},
      {id:'demo3',title:'复盘今天 + 列明天清单',time:'20:30',repeat:'daily',date:'',note:'记录 1 个改进点',enabled:true,notified:[],demo:true}
    ],done:{},settings:{summaryEnabled:true}};
  }
  function load(){
    try{
      var raw=localStorage.getItem(KEY);
      if(!raw){var s=defaultState();save(s);return s}
      var o=JSON.parse(raw);
      if(!o||!Array.isArray(o.tasks))throw new Error('bad');
      o.done=o.done||{};o.settings=o.settings||{summaryEnabled:true};
      o.tasks.forEach(function(t){t.notified=t.notified||[];t.id=t.id||('t'+Date.now()+Math.random())});
      return o;
    }catch(e){var s2=defaultState();save(s2);return s2}
  }
  function save(s){
    try{localStorage.setItem(KEY,JSON.stringify(s||state))}catch(e){toast('本地保存失败，请检查浏览器存储')}
  }
  var state=load();

  function toast(msg,undo){
    var el=$('toast');
    el.textContent=msg;
    if(undo){
      var button=document.createElement('button');
      button.type='button';button.textContent='撤销';
      button.addEventListener('click',undo,{once:true});
      el.append(button);
    }
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){el.classList.remove('show');el.replaceChildren()},undo?6500:2600);
  }
  function orderedWeekdays(days){
    if(!Array.isArray(days))return [];
    return WEEKDAY_ORDER.filter(function(day){return days.includes(day)});
  }
  function taskOccursOn(task,date){
    if(task.repeat==='daily')return true;
    if(task.repeat==='weekly')return orderedWeekdays(task.weekdays).includes(date.getDay());
    return task.date===dayKey(date);
  }
  function isDone(id,key){return (state.done[key]||[]).indexOf(id)>=0}
  function toggleDone(id){
    var date=new Date(), k=dayKey(date), completed=state.done[k]||[];
    var i=completed.indexOf(id);
    var task=state.tasks.find(function(item){return item.id===id});
    if(i<0&&task&&task.repeat==='weekly'&&!taskOccursOn(task,date)){
      toast('这条待办今天不安排');return;
    }
    if(i>=0)completed.splice(i,1);else completed.push(id);
    state.done[k]=completed;
    save();render();
  }

  function notify(title,body,tag){
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    var opt={body:body,tag:tag||('todo-'+Date.now()),icon:'./icon-192.png',badge:'./icon-192.png',
      data:{url:location.href},requireInteraction:false};
    try{
      if(navigator.serviceWorker&&navigator.serviceWorker.ready){
        navigator.serviceWorker.ready.then(function(reg){reg.showNotification(title,opt)})
          .catch(function(){try{new Notification(title,opt)}catch(e){}});
      }else{new Notification(title,opt)}
    }catch(e){}
  }

  function checkAlarms(){
    var d=new Date(),k=dayKey(d),now=hm(d),changed=false;
    state.tasks.forEach(function(t){
      if(t.enabled===false||t.time!==now||!taskOccursOn(t,d)||isDone(t.id,k))return;
      if((t.notified||[]).indexOf(k)>=0)return;
      t.notified=(t.notified||[]).concat(k).slice(-40);changed=true;
      notify(t.title,t.note||'到点啦，现在去做这件事', 'alarm-'+t.id+'-'+k);
    });
    if(changed)save();
  }

  function updateClock(){
    var d=new Date(),k=dayKey(d);
    $('clock').textContent=hm(d);
    $('dateLine').textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 · '+WEEK[d.getDay()];
    $('weekLine').textContent=WEEK[d.getDay()];
    var pending=state.tasks.filter(function(t){return t.enabled!==false&&taskOccursOn(t,d)&&!isDone(t.id,k)});
    pending.sort(function(a,b){return a.time<b.time?-1:a.time>b.time?1:0});
    if(pending.length){
      var nx=pending[0];
      $('nextTitle').textContent=nx.title;
      $('nextMeta').textContent=nx.time;
    }else{
      $('nextTitle').textContent='今天暂无待办';
      $('nextMeta').textContent='';
    }
    $('nextMeta').classList.toggle('hidden',!pending.length);
    if(k!==lastDay){lastDay=k;render()}
  }

  function taskHTML(t,k){
    var done=isDone(t.id,k);
    var meta='<em>'+t.time+'</em>';
    if(t.repeat==='once')meta+='<span class="once">'+escapeHTML(t.date)+'</span>';
    else if(t.repeat==='weekly'){
      var days=orderedWeekdays(t.weekdays).map(function(day){return WEEK[day].slice(2)});
      meta+='<span>每周'+days.join('、')+'</span>';
    }else meta+='<span>每天</span>';
    if(t.note)meta+='<span>'+escapeHTML(t.note)+'</span>';
    return '<div class="card task'+(done?' done':'')+'">'+
      '<button class="check" data-act="toggle" data-id="'+t.id+'" aria-label="完成">'+(done?'✓':'')+'</button>'+
      '<div class="t-main" data-act="edit" data-id="'+t.id+'"><div class="t-title">'+escapeHTML(t.title)+'</div>'+
      '<div class="t-meta">'+meta+'</div></div>'+
      '<button class="del" data-act="del" data-id="'+t.id+'" aria-label="删除">×</button></div>';
  }
  function escapeHTML(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

  function render(){
    var date=new Date(), k=dayKey(date);
    var todayTasks=state.tasks.filter(function(t){return taskOccursOn(t,date)});
    var doneIds=state.done[k]||[];
    var list=state.tasks.slice();
    if(filter==='today')list=todayTasks.filter(function(t){return !isDone(t.id,k)});
    else if(filter==='done')list=list.filter(function(t){return doneIds.indexOf(t.id)>=0});
    $('doneCount').textContent=todayTasks.filter(function(t){return isDone(t.id,k)}).length;
    $('totalCount').textContent=todayTasks.length;

    if(!list.length){
      var emptyText={all:'暂无待办',today:'今天暂无待办',done:'今天还没有完成的待办'};
      $('taskList').innerHTML='<div class="card empty"><b>'+emptyText[filter]+'</b></div>';return;
    }
    list.sort(function(a,b){return a.time<b.time?-1:a.time>b.time?1:0});
    $('taskList').innerHTML=list.map(function(t){return taskHTML(t,k)}).join('');
  }

  var weekdayInputs=Array.from($('weekdayPicker').querySelectorAll('input'));
  function updateRepeatFields(){
    var repeat=$('repeatInput').value;
    $('dateInput').classList.toggle('hidden',repeat!=='once');
    $('weekdayPicker').classList.toggle('hidden',repeat!=='weekly');

  function setWeekdayFields(days){

  function startEdit(id){
    var t=state.tasks.filter(function(x){return x.id===id})[0];if(!t)return;
    editingId=id;
    $('titleInput').value=t.title;$('timeInput').value=t.time;
    $('repeatInput').value=t.repeat;$('dateInput').value=t.date||dayKey(new Date());
    $('noteInput').value=t.note||'';
    setWeekdayFields(orderedWeekdays(t.weekdays));
    updateRepeatFields();
    $('formTitle').textContent='编辑待办';$('saveBtn').textContent='保存修改';
    $('cancelBtn').classList.remove('hidden');
    window.scrollTo({top:0,behavior:'smooth'});$('titleInput').focus();

  function cancelEdit(){
    editingId=null;$('titleInput').value='';$('noteInput').value='';
    $('formTitle').textContent='添加待办';$('saveBtn').textContent='添加待办';
    $('cancelBtn').classList.add('hidden');
  }
  function submit(){
    var title=$('titleInput').value.trim();
    if(!title){toast('先写下要做的事');$('titleInput').focus();return}
    var repeat=$('repeatInput').value;
    var weekdays=repeat==='weekly'?weekdayInputs.filter(function(input){return input.checked})
      .map(function(input){return Number(input.value)}):[];
    if(repeat==='weekly'&&!weekdays.length){
      toast('请选择至少一个星期几');weekdayInputs[0].focus();return;
    }
    var obj={title:title,time:$('timeInput').value||'09:00',repeat:repeat,weekdays:weekdays,
      date:repeat==='once'?($('dateInput').value||dayKey(new Date())):'',note:$('noteInput').value.trim()};
    if(editingId){
      state.tasks.forEach(function(t){if(t.id===editingId){
        Object.assign(t,obj,{notified:[]});
      }});
      toast('已更新');cancelEdit();
    }else{
      var id='t'+Date.now()+Math.floor(Math.random()*1000);
      state.tasks.push(Object.assign({id:id,enabled:true,notified:[]},obj));
      toast('已添加待办');cancelEdit();
    }
    save();render();updateClock();
  }

  function exportData(){
    var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='待办-'+dayKey(new Date())+'.json';a.click();

  function importData(file){
    var r=new FileReader();
    r.onload=function(){
      var o;
      try{
        o=JSON.parse(r.result);
        if(!o||!Array.isArray(o.tasks))throw new Error('bad');
      }catch(e){toast('文件格式不对，导入失败');return}
      askConfirm('导入待办','导入会覆盖当前所有待办，确定继续？','确认导入').then(function(ok){
        if(!ok)return;
        o.done=o.done||{};o.settings=o.settings||{summaryEnabled:true};
        o.tasks.forEach(function(t){t.notified=t.notified||[];t.id=t.id||('t'+Date.now()+Math.random())});
        state=o;save();render();updateClock();toast('导入成功');
      });
    };
    r.readAsText(file);
  }

  // Ledger and pet journal
  var AKEY='cc-asset-v1', PET_KEY='cc-pets-v1', LAST_ACCOUNT='cc-ledger-account';
  var ACCOUNTS=[
    {id:'alipay',name:'支付宝'},{id:'wechat',name:'微信'},
    {id:'bank',name:'银行卡'},{id:'other',name:'其他'}
  ];
  var ENTRY_TYPES=[
    {id:'daily',name:'日常'},{id:'weight',name:'体重'},{id:'care',name:'护理'},
    {id:'deworm',name:'驱虫'},{id:'vaccine',name:'疫苗'},{id:'vet',name:'就诊'}
  ];
  var petId='', journalEditingId='', ledgerPetId='';
  var journalDialog=$('journalDialog');

  function readJournal(key,fallback){
    try{return JSON.parse(localStorage.getItem(key))||fallback}
    catch(err){return fallback}
  }
  function writeJournal(key,data){
    try{localStorage.setItem(key,JSON.stringify(data));return true}
    catch(err){return false}
  }
  function loadAsset(){return readJournal(AKEY,[])}
  function loadPets(){return readJournal(PET_KEY,{profiles:[],entries:[]})}
  function fmtMoney(n){
    return '¥'+Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
  }
  function journalId(){
    return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
  }
  function labelFor(options,id){
    var item=options.find(function(option){return option.id===id});
    return item?item.name:'其他';
  }
  function optionList(options){
    return options.map(function(item){
      return '<option value="'+escapeHTML(item.id)+'">'+escapeHTML(item.name)+'</option>';
    }).join('');
  }
  function validDate(value){
    if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;
    var date=new Date(value+'T00:00:00Z');
    return Number.isFinite(date.getTime())&&date.toISOString().slice(0,10)===value;
  }
  function decimalValue(value){
    var text=value.trim().replace(',','.');
    return /^\d{1,10}(\.\d{1,2})?$/.test(text)?Number(text):0;
  }
  function latestFirst(items){
    return items.slice().reverse().sort(function(a,b){return b.date.localeCompare(a.date)});
  }
  function signedMoney(record){
    return (record.type==='income'?'+':'−')+fmtMoney(record.amount);
  }
  function journalRow(title,detail,amount,action,id){
    return '<div class="journal-row"><div class="journal-main"><b>'+escapeHTML(title)+'</b><small>'+
      escapeHTML(detail)+'</small></div>'+amount+
      '<button class="btn ghost" type="button" data-journal-action="'+action+'" data-id="'+
      escapeHTML(id)+'">编辑</button></div>';
  }
  function renderAsset(){
    var records=loadAsset(), month=dayKey(new Date()).slice(0,7);
    var income=0,expense=0;
    records.forEach(function(record){
      if(!record.date.startsWith(month))return;
      var cents=Math.round(record.amount*100);
      if(record.type==='income')income+=cents;
      else expense+=cents;
    });
    $('assetSummary').innerHTML=[['收入',income],['支出',expense],['结余',income-expense]].map(function(total){
      return '<div><dt>'+total[0]+'</dt><dd>'+fmtMoney(total[1]/100)+'</dd></div>';
    }).join('');
    var account=$('assetAccountFilter').value,type=$('assetTypeFilter').value;
    var pets=loadPets().profiles;
    var rows=latestFirst(records).filter(function(record){
      return (!account||record.account===account)&&(!type||record.type===type);
    }).map(function(record){
      var pet=pets.find(function(profile){return profile.id===record.petId});
      var detail=record.date+' · '+labelFor(ACCOUNTS,record.account)+(pet?' · '+pet.name:'');
      var amount='<span class="journal-money '+(record.type==='income'?'income':'')+'">'+signedMoney(record)+'</span>';
      return journalRow(record.note||(record.type==='income'?'收入':'支出'),detail,amount,'ledger',record.id);
    });
    $('assetRows').innerHTML=rows.join('')||'<p class="journal-empty">暂无符合条件的流水。</p>';
  }
  function renderPets(){
    var pets=loadPets();
    var profile=pets.profiles.find(function(item){return item.id===petId})||pets.profiles[0];
    petId=profile?profile.id:'';
    $('petPicker').classList.toggle('hidden',!profile);
    $('petTimelineCard').classList.toggle('hidden',!profile);
    $('petSelect').innerHTML=optionList(pets.profiles);
    $('petSelect').value=petId;
    if(!profile){
      $('petProfile').innerHTML='<p class="journal-empty">添加宠物后，就可以记录体重、护理、就诊和日常。</p>';
      $('petTimeline').replaceChildren();
      return;
    }
    var info=[profile.species,profile.birthday?'生日 '+profile.birthday:'',profile.bio].filter(Boolean);
    $('petProfile').innerHTML=journalRow(profile.name,info.join(' · '),'','profile',profile.id);
    var records=loadAsset().filter(function(record){return record.petId===profile.id});
    var entries=pets.entries.filter(function(entry){return entry.petId===profile.id});
    $('petTimeline').innerHTML=latestFirst(entries.concat(records)).map(function(item){
      if(item.account){
        return journalRow(item.note||'关联收支',item.date+' · '+labelFor(ACCOUNTS,item.account),
          '<span class="journal-money">'+signedMoney(item)+'</span>','ledger',item.id);
      }
      var heading=labelFor(ENTRY_TYPES,item.type)+(item.type==='weight'?' · '+item.weight+' kg':'');
      return journalRow(heading,[item.date,item.note].filter(Boolean).join(' · '),'','entry',item.id);
    }).join('')||'<p class="journal-empty">还没有日常记录或关联收支。</p>';
  }
  function renderJournal(){renderAsset();renderPets()}

  function setDeleteButton(form,record,onDelete){

    var button=document.createElement('button');
    button.type='button';
    button.className='btn ghost';
    button.dataset.remove='';
    button.textContent='删除';
    button.addEventListener('click',onDelete);
    footer.prepend(button);
  }
  function openLedger(record,profile){
    journalEditingId=record?record.id:'';
    ledgerPetId=record?(record.petId||''):(profile?profile.id:'');
    try{var lastAccount=localStorage.getItem(LAST_ACCOUNT)}catch(err){}
    $('ledgerAmount').value=record?record.amount:'';
    $('ledgerType').value=record?record.type:'expense';
    $('ledgerAccount').value=record?record.account:(lastAccount||'wechat');

    $('ledgerDate').value=record?record.date:dayKey(new Date());
    $('ledgerNote').value=record?record.note||'':'';
    setDeleteButton($('ledgerForm'),record,function(){
      journalDialog.close();
      askConfirm('删除流水',record.petId?'这笔流水也会从宠物时间线移除。确定删除？':'确定删除这笔流水？','删除').then(function(ok){
        if(ok)finishJournal(AKEY,loadAsset().filter(function(item){return item.id!==record.id}),'已删除流水');
      });
    });
    openJournal('ledger',record?'编辑流水':(profile?'记开销 · '+profile.name:'记一笔'));
    $('ledgerAmount').focus();
  }

    $('petBirthday').value=profile?profile.birthday:'';

  function updateWeightField(){

  function openEntry(entry){
    var profiles=loadPets().profiles;
    if(!profiles.length){openProfile();return}
    journalEditingId=entry?entry.id:'';
    $('entryPet').innerHTML=optionList(profiles);
    $('entryPet').value=entry?entry.petId:(petId||profiles[0].id);
    $('entryDate').value=entry?entry.date:dayKey(new Date());
    $('entryType').value=entry?entry.type:'daily';
    $('entryWeight').value=entry&&entry.weight?entry.weight:'';
    $('entryNote').value=entry?entry.note:'';
    updateWeightField();

  function validItems(items,validate){
    if(!Array.isArray(items))return false;
    var ids=new Set();
    return items.every(function(item){
      if(!item||typeof item.id!=='string'||!item.id||ids.has(item.id))return false;
      ids.add(item.id);
      return validate(item);
    });
  }
  function validBackup(data){
    if(!data||data.format!=='cc-ledger-pets'||data.version!==1||!data.pets)return false;
    if(!validItems(data.pets.profiles,function(profile){
      return typeof profile.name==='string'&&profile.name.trim()&&typeof profile.species==='string'&&
        (profile.birthday===''||validDate(profile.birthday))&&typeof profile.bio==='string';
    }))return false;
    var profileIds=new Set(data.pets.profiles.map(function(profile){return profile.id}));
    return validItems(data.ledger,function(record){
      return ACCOUNTS.some(function(account){return account.id===record.account})&&
        ['income','expense'].includes(record.type)&&Number.isFinite(record.amount)&&record.amount>0&&
        validDate(record.date)&&typeof record.note==='string'&&
        (!record.petId||profileIds.has(record.petId));
    })&&validItems(data.pets.entries,function(entry){
      return profileIds.has(entry.petId)&&ENTRY_TYPES.some(function(type){return type.id===entry.type})&&
        validDate(entry.date)&&typeof entry.note==='string'&&
        (entry.type!=='weight'||(Number.isFinite(entry.weight)&&entry.weight>0));
    });
  }

      title:{type:'string',description:'标题'},body:{type:'string',description:'正文'}},required:['title','body']}}}
  ];
  function aiStats(){
    var date=new Date(), k=dayKey(date), t=state.tasks.filter(function(task){return taskOccursOn(task,date)});
    var done=t.filter(function(x){return isDone(x.id,k)}).length;
    var recs=loadAsset(),inc=0,exp=0;
    recs.forEach(function(r){if(r.type==='income')inc+=Number(r.amount);else exp+=Number(r.amount)});
    return JSON.stringify({todayTasks:t.length,todayDone:done,totalTasks:state.tasks.length,
      income:Number(inc.toFixed(2)),expense:Number(exp.toFixed(2)),balance:Number((inc-exp).toFixed(2)),
      records:recs.length,notes:loadNotes().length,
      finance:loadFin()});
  }
  function execAITool(name,args){
    args=args||{};
    if(name==='add_todo'){
      var title=String(args.title||'').trim();if(!title)return '待办内容为空';
      var tm=/^\d{1,2}:\d{2}$/.test(args.time||'')?args.time:'09:00';
      if(tm.length===4)tm='0'+tm;
      var rp=['once','weekly'].includes(args.repeat)?args.repeat:'daily';
      var weekdays=rp==='weekly'?orderedWeekdays(args.weekdays):[];
      if(rp==='weekly'&&!weekdays.length)return '请选择每周重复的星期几';
      state.tasks.push({id:'t'+Date.now()+Math.floor(Math.random()*1000),title:title.slice(0,60),time:tm,
        repeat:rp,weekdays:weekdays,date:rp==='once'?dayKey(new Date()):'',
        note:String(args.note||'').slice(0,80),enabled:true,notified:[]});
      save();render();updateClock();
      return '已添加待办「'+title.slice(0,20)+'」'+tm;
    }
    if(name==='add_record'){
      var amt=Number(args.amount);if(!amt||isNaN(amt))return '金额无效';
      var acc=['alipay','wechat','bank','other'].indexOf(args.account)>=0?args.account:'other';
      var arr=loadAsset();
      arr.push({id:'a'+Date.now()+Math.floor(Math.random()*1000),account:acc,type:amt>0?'income':'expense',
        amount:Math.abs(amt),note:String(args.note||'').slice(0,40),date:dayKey(new Date())});
      if(!writeJournal(AKEY,arr))return '本地保存失败';
      renderJournal();
      return '已记一笔'+(amt>0?'收入':'支出')+fmtMoney(Math.abs(amt));
    }
    if(name==='add_note'){
      var ti=String(args.title||'').trim()||'无标题记事';
      var bd=String(args.body||'').trim();
      var now=Date.now();
      notes.push({id:'n'+now+Math.floor(Math.random()*1000),title:ti.slice(0,60),body:bd.slice(0,3000),
        sketch:'',created:now,updated:now});
      saveNotes();renderNotes();
      return '已写入记事「'+ti.slice(0,20)+'」';
    }
    if(name==='query_stats')return aiStats();
    return '未知操作';
  }
  function aiAddMsg(role,text,act){
    var wrap=document.createElement('div');wrap.className='ai-msg '+role;
    var av=document.createElement('div');av.className='ai-av';av.textContent=role==='user'?'我':'✦';
    var bub=document.createElement('div');bub.className='ai-bubble';bub.textContent=text;
    wrap.appendChild(av);wrap.appendChild(bub);
    if(act){var a=document.createElement('div');a.className='ai-act';a.textContent='✓ '+act;bub.appendChild(a)}
    $('aiMsgs').appendChild(wrap);
    $('aiMsgs').scrollTop=$('aiMsgs').scrollHeight;
  }
  function aiTyping(on){
    var old=$('aiTyping');if(old)old.parentNode.removeChild(old);
    if(!on)return;
    var wrap=document.createElement('div');wrap.className='ai-msg bot';wrap.id='aiTyping';
    var av=document.createElement('div');av.className='ai-av';av.textContent='✦';
    var bub=document.createElement('div');bub.className='ai-bubble';
    bub.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';
    wrap.appendChild(av);wrap.appendChild(bub);$('aiMsgs').appendChild(wrap);
    $('aiMsgs').scrollTop=$('aiMsgs').scrollHeight;
  }
  async function aiInitCloud(){
    if(aiCloud)return;
    if(typeof WorkBuddyCloud==='undefined')throw new Error('SDK 未加载，请检查网络');
    var cloud=WorkBuddyCloud.createWorkBuddyCloud({
      endpoint:AI_ENDPOINT,oauthRelayBaseUrl:OAUTH_RELAY,publishableKey:AI_PUBKEY
    });
    var models=await cloud.llm.models.list();
    var model=models&&models.find(function(item){return item.disabled!==true});
    if(!model)throw new Error('当前没有可用的 AI 模型');
    aiModel=model;
    aiCloud=cloud;
  }
  function aiChat(messages,tools){
    var request={model:aiModel.id,messages:messages,stream:true,temperature:0.7};
    if(tools)request.tools=tools;
    // Managed conversations are only available on the WorkBuddy app origin.
    if(location.origin===AI_ENDPOINT)request.conversationId=aiConvId();
    return aiCloud.llm.chat.completions.create(request);
  }
  function aiErrorMsg(err){
    var code=(err&&err.error&&err.error.code)||'';
    if(/^auth_/.test(code))return 'AI 连接验证失败，请稍后重试或检查应用设置';
    if(code==='quota_rate_limited')return 'AI 用得太快啦，稍等几秒再试';
    if(/^quota_/.test(code))return 'AI 额度暂时用完了，明天再来吧';
    if(/^gateway_|^model_/.test(code))return 'AI 服务暂时开小差，请重试';
    if(/SDK|模型/.test(err&&err.message||''))return err.message;
    return 'AI 没连上，检查网络后重试';
  }
  async function aiSend(text){
    text=String(text||'').trim().slice(0,500);
    if(!text||aiBusy)return;
    var now=Date.now();
    if(now-aiLastCall<1200){toast('说慢一点，稍等再发');return}
    aiLastCall=now;
    aiAddMsg('user',text);
    $('aiText').value='';
    aiBusy=true;$('aiSend').disabled=true;aiTyping(true);
    var messages=[{role:'system',content:aiSystemPrompt()}];
    aiHistory.forEach(function(x){messages.push({role:x.role,content:x.content})});
    messages.push({role:'user',content:text});
    aiHistory.push({role:'user',content:text});
    try{
      await aiInitCloud();
      var answer='',rawTool='';
      // 第一轮：可能调用工具
      var stream1=await aiChat(messages,AI_TOOLS);
      for await (var chunk of stream1){
        var d=chunk.choices&&chunk.choices[0]&&chunk.choices[0].delta;
        if(!d)continue;
        if(d.content)answer+=d.content;
        if(d.tool_calls){
          for(var i=0;i<d.tool_calls.length;i++){
            var tc=d.tool_calls[i],ix=tc.index||0;
            if(!rawTool)rawTool='[]';
            var arr=JSON.parse(rawTool);
            if(!arr[ix])arr[ix]={id:'',name:'',args:''};
            if(tc.id)arr[ix].id=tc.id;
            if(tc.function&&tc.function.name)arr[ix].name=tc.function.name;
            if(tc.function&&tc.function.arguments)arr[ix].args+=tc.function.arguments;
            rawTool=JSON.stringify(arr);
          }
        }
      }
      var acts=[];
      if(!rawTool||rawTool==='[]'){
        if(!answer){
          var plain='';
          var plainStream=await aiChat(messages);
          for await (var pc of plainStream){
            var pd=pc.choices&&pc.choices[0]&&pc.choices[0].delta;
            if(pd&&pd.content)plain+=pd.content;
          }
          answer=plain;
        }
      }
      if(rawTool&&rawTool!=='[]'){
        var toolList=JSON.parse(rawTool);
        toolList.forEach(function(t){
          if(!t.name)return;
          try{
            var parsed=JSON.parse(t.args||'{}');
            var result=execAITool(t.name,parsed);
            if(t.name!=='query_stats')acts.push(result);
            messages.push({role:'assistant',content:'',tool_calls:[{
              id:t.id,type:'function',function:{name:t.name,arguments:t.args||'{}'}}]});
            messages.push({role:'tool',tool_call_id:t.id,content:result});
          }catch(e){acts.push('操作失败：'+(e.message||'格式错误'))}
        });
        // 第二轮：基于工具结果生成回复
        if(acts.length){
          var follow='';
          var stream2=await aiChat(messages);
          for await (var c2 of stream2){
            var d2=c2.choices&&c2.choices[0]&&c2.choices[0].delta;
            if(d2&&d2.content)follow+=d2.content;
          }
          if(follow)answer=follow;
        }
      }
      aiTyping(false);aiBusy=false;$('aiSend').disabled=false;
      var finalText=answer||(acts.length?acts.join('，'):'好的');
      aiAddMsg('bot',finalText,acts.length?acts.join(' · '):'');
      aiHistory.push({role:'assistant',content:finalText});
      saveAIHistory();
    }catch(err){
      aiTyping(false);aiBusy=false;$('aiSend').disabled=false;
      aiAddMsg('bot',aiErrorMsg(err));
    }
  }
  // AI events
  $('aiFab').addEventListener('click',function(){
    $('aiPanel').classList.remove('hidden');$('aiFab').classList.add('hidden');$('quickAdd').classList.add('hidden');$('tabbar').classList.add('hidden');
    setTimeout(function(){$('aiText').focus()},80);
  });
  $('aiClose').addEventListener('click',function(){
    $('aiPanel').classList.add('hidden');$('aiFab').classList.remove('hidden');$('quickAdd').classList.remove('hidden');$('tabbar').classList.remove('hidden');
  });
  $('aiNew').addEventListener('click',function(){
    newConv();$('aiMsgs').innerHTML='';
    aiAddMsg('bot','新对话开始啦，想让我帮你做什么？');
    toast('已开启新对话');
  });
  $('aiQuick').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    aiSend(b.dataset.q);
  });
  $('aiSend').addEventListener('click',function(){aiSend($('aiText').value)});
  $('aiText').addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();aiSend(this.value)}
  });
  if(aiHistory.length){
    aiHistory.forEach(function(x){aiAddMsg(x.role,x.content)});
  }else{
    aiAddMsg('bot','你好呀，我是你的 AI 助手 ✦ 我可以帮你加待办、记账、写记事，还能查你的收支统计。直接说就行～');
  }

  // weather
  var CITY={
    beijing:{n:'北京',lat:39.9042,lon:116.4074},shanghai:{n:'上海',lat:31.2304,lon:121.4737},
    guangzhou:{n:'广州',lat:23.1291,lon:113.2644},shenzhen:{n:'深圳',lat:22.5431,lon:114.0579},
    changsha:{n:'长沙',lat:28.2282,lon:112.9388},hangzhou:{n:'杭州',lat:30.2741,lon:120.1551},
    chengdu:{n:'成都',lat:30.5728,lon:104.0668},xiamen:{n:'厦门',lat:24.4798,lon:118.0894}
  };
  var WKEY='cc-weather-city';
  var WMAP={0:['晴','☀'],1:['多云','☀'],2:['多云','⛅'],3:['阴','☁'],45:['雾','☁'],48:['雾','☁'],
    51:['小雨','☂'],53:['小雨','☂'],55:['中雨','☂'],56:['冻雨','☂'],57:['冻雨','☂'],
    61:['小雨','☂'],63:['中雨','☂'],65:['大雨','☂'],66:['冻雨','☂'],67:['冻雨','☂'],
    71:['小雪','❄'],73:['中雪','❄'],75:['大雪','❄'],77:['雪','❄'],
    80:['阵雨','☂'],81:['阵雨','☂'],82:['强阵雨','☂'],85:['阵雪','❄'],86:['阵雪','❄'],
    95:['雷阵雨','☂'],96:['雷阵雨','☂'],99:['雷暴','☂']};
  function loadCity(){try{return localStorage.getItem(WKEY)||'beijing'}catch(e){return 'beijing'}}
  function fetchWeather(lat,lon,label){
    $('wDesc').textContent='天气获取中…';
    var url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+
      '&current=temperature_2m,weather_code&timezone=auto';
    fetch(url).then(function(r){return r.json()}).then(function(j){
      var c=j&&j.current;
      if(!c)throw new Error('no data');
      var m=WMAP[c.weather_code]||['—','◌'];
      $('wTemp').textContent=Math.round(c.temperature_2m);
      $('wIcon').textContent=m[1];
      $('wDesc').textContent=m[0]+' · '+(label||'当前城市');
    }).catch(function(){
      $('wTemp').textContent='--';$('wIcon').textContent='◌';
      $('wDesc').textContent='天气获取失败，请联网后重试';
    });
  }
  function refreshWeather(){
    var key=loadCity(),c=CITY[key]||CITY.beijing;
    $('citySelect').value=CITY[key]?key:'beijing';
    $('cityDesc').classList.add('hidden');
    fetchWeather(c.lat,c.lon,c.n);
  }
  $('citySelect').addEventListener('change',function(){
    try{localStorage.setItem(WKEY,this.value)}catch(e){}
    refreshWeather();
  });
  $('locateBtn').addEventListener('click',function(){
    if(!navigator.geolocation){toast('当前浏览器不支持定位');return}
    toast('正在定位…');
    navigator.geolocation.getCurrentPosition(function(pos){
      var la=pos.coords.latitude,lo=pos.coords.longitude;
      $('cityDesc').textContent='已定位';
      $('cityDesc').classList.remove('hidden');
      fetchWeather(la,lo,'我的位置');
    },function(){toast('定位失败或已拒绝，请用城市切换')},{timeout:10000});
  });

  // init
  fillDefaults();render();updateClock();updateNoticeUI();checkAlarms();renderProfile();renderJournal();renderFin();renderNotes();refreshWeather();
  setInterval(updateClock,1000);
  setInterval(checkAlarms,10000);
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})});
  }
})();
</script>
