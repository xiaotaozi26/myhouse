<section class="annotation" aria-label="标注工作区"><nav id="steps" class="steps" aria-label="标注步骤"></nav><div class="work-instruction"><span id="instruction"></span><button id="undo" disabled>撤销上次修改</button><button id="check">检查问题</button><button type="button" id="bulk-check" disabled>批量核对本步骤</button></div><div id="problems" hidden></div><template id="task-guidance"><div><h3>人物置信度：大致把握即可，不必逐条校准</h3><p>人物置信度大致表示对人物识别结果的把握，范围 0–1，不要求精确区分小数差异。原分数合理就保留：模型给出的 0.9、0.82 等都可以，不必因为能认出就改成 1。都能辨认清楚时，也可以按自己的试标习惯统一为 0.9 左右；保留原值或统一填写均可，不强制采用某个分值或分档，不要求为了统一数字而逐条改分。</p><p>重点核对有没有认错人或确实拿不准。画面模糊、侧脸或遮挡，但结合本集材料能认出是谁，不必刻意降分；不知道正式姓名或拿不准字形，另在姓名和“姓名把握”中记录。确实不确定时写清具体疑问，分数可按实际把握调整，不强制改为 0.5 或其他指定值。</p><p>明确不是这个角色，是归属错误：在该脸的“属于”中改到正确人物；确为另一个人物且名单中没有时，选“单独成为新人物”。暂不知道应归谁，先移到“不属于任何人物”并记疑问。不要仅给低分而留在错误人物名下，也不要把真实的另一个人标成“误检”。同一编号混了不同人物时，先移出错误归属并记录各处时间和实际人物，不能整组强行认成同一人。</p><p>目标人脸编号与视频中的实际对象无法可靠对应时，按页面已有的“未可靠定位／无法确认”处理，写明原因，不保留猜测的姓名、角色及不成立的结论。模糊但能可靠认出是谁，不属于这种情况。本次更新不会批量改写原有分数。</p><h3>姓名、称谓和别名</h3><p>正式姓名填人物在故事中的姓名，有依据的候选也可以填；称谓是按职务、身份、辈分或关系叫他的方式，如“江总”“大哥”；别名是同一人物实际使用的其他名字、小名或化名。只被别人提到的人名，不能自动归给镜头中的人物。</p><p>没有台词字幕不等于姓名全部留空。“姓名把握”选确认：本集清晰文字明确给出字形，并能对应到这个人；选候选：由听得清的自我介绍、称呼或上下文支持，但没有字形确证；选未定：名字或归属还拿不准。机标名字、ASR 和高置信度都不是确认依据。称谓与别名同样要有本集证据。</p><p>像“静琬／静婉”只听声音不能定字形：正式姓名不任选同音字，留空；在“冲突与不足”或待确认事项写“姓名字形待确认：听音 jing wan，00:12.3，被某人当面呼唤”。显示名可用可区分的外观或身份描述继续标。听不清就写听不清，不编拼音；不把拼音、问号或备选字串当成正式姓名。</p><p>本批只用下发材料作标注证据，不自行搜索演员表、百科或其他剧集补姓名；确需补充资料时，记录疑问交项目对接人统一提供可核查材料。原来已有姓名也要核对，不因预填了就选确认。</p></div></template><div id="form-scroll"><div id="empty" class="welcome"><h1>怎么核对人物与对白</h1><p>先认人，再跟着视频逐段核对台词和声音。</p><ol id="quick-guide" class="quick-guide"><li>在「认人」里查看每个人物的脸和基本信息，把分错的人脸归到正确人物。</li><li>逐段播放，核对谁出现、谁在说话、说了什么，以及台词时间。看完可点「批量核对本段」。</li><li>看完后点「核对」，有疑问点 ⚑。处理完问题后，点「完成并提交」。</li></ol><p class="muted">请从工作台打开分配给你的任务。</p></div><div id="round-panel" hidden></div><div id="form"></div></div><footer class="decision"><button id="prev">← 上一集</button><button id="next">下一集 →</button><span id="progress">尚未打开</span><button id="next-step" hidden>下一步 →</button><button id="complete" class="primary">完成并提交</button></footer></section></main>

  const seg=clone(at(doc(t),p.slice(0,2)));if(Number.isFinite(seg.start))shiftLocal({shots:seg.shots,dialogue:seg.dialogue},v-seg.start);// keep shots and lines at the same episode time

// C: face frames per sidecar URL, kept for the session; a sidecar that did not load is tried again on the next import.
const frameCache=new Map();
async function loadFaceFrames(urls){
 const todo=urls.filter(url=>!frameCache.has(url));let next=0;if(!todo.length)return frameCache;
 message('正在加载 '+todo.length+' 集的人脸逐帧数据…');
 const worker=async()=>{while(next<todo.length){const url=todo[next++];try{const r=await fetch(displayURL(C.faceFramesURL(url)),{signal:AbortSignal.timeout?.(20000)});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();if(!Array.isArray(data?.frames))throw Error('no frames');frameCache.set(url,C.faceFrames(data));}catch{/* seeded at person level; the episode shows a notice */}}};
 await Promise.all(Array.from({length:Math.min(6,todo.length)},worker));$('message').hidden=true;return frameCache;
}
async function parseTaskData(text){
 // The original G data is seeded into this page's task; C first loads the face frames the seeds need (never blocking).
 let parsed=C.parse(text,TASK);if(parsed.sidecars.length)parsed=C.parse(text,TASK,await loadFaceFrames(parsed.sidecars));
 const lost=parsed.missingFrames?parsed.missingFrames+' 集的人脸逐帧数据没有加载成功，这些集“是谁”只预选到人物。可以照常标注，看到编号框时选具体的脸。':'';
 return {parsed,lost};
}

// Operators entered at export or round start own this round's unattributed actions.
function attribute(operator){
 for(const r of state.rows){const review=r.prompt_g_review;if(!review)continue;const n=C.roundOf(r).n;
  for(const h of review.history||[])if(!h.operator&&(h.round??0)===n)h.operator=operator;
  for(const list of Object.values(review.checks||{}))for(const c of Object.values(list))if(!c.operator&&c.round===n)c.operator=operator;
  for(const c of Object.values(review.confirmed||{}))if(c&&!c.operator)c.operator=operator;
  for(const f of Object.values(review.problems||{}))if(!f.by)f.by=operator;
  if(review.submitted_at&&!review.completed_by)review.completed_by=operator;if(review.verdict&&!review.verdict.operator)review.verdict.operator=operator;if(review.round&&!review.round.operator)review.round.operator=operator;if(review.work&&!review.work.operator)review.work.operator=operator;}
}

 return '\ufeff'+[WORK_COLUMNS,...rows.map(r=>{const review=r.prompt_g_review||{},w=review.work||{},done=C.isComplete(r),rd=C.roundOf(r),sum=rd.n?C.roundSummary(r):null,qc=sum?.role==='qc';
  return [state.assignment,r.item_id,w.operator||(w.active_seconds?operator:''),w.started_at||'',done?w.finished_at||review.submitted_at:'',w.active_seconds?(w.active_seconds/60).toFixed(1):'','',Object.values(review.problems||{}).map(f=>f.note).join('；'),done?file:'',w.round??rd.n,qc?VERDICT[sum.verdict]||'':'',qc?sum.missed:'',qc?sum.wrong:''].map(cell).join(',');})].join('\r\n')+'\r\n';

   (one judged voice type split_voice per line; the voice source and delivery type follow from it at export), voice-only roles,

   4.1 (requester 2026-11-13, the record fields a person can judge): each person and voice-only person also has tags and persona
   (the identity phase); each line split_emotions, split_emotion_reason, split_intonation and split_av_sync; and the episode's
   sounds (G3 split_audio_events) are rows of the script after the line they follow.
   The page follows the video instead of the schema: 认人 (one row per person: its faces, names, category and role) →

Object.assign(labels,{age_group:'年龄段',importance:'戏份',name_status:'姓名把握',split_voice:'声音类型',split_voice_persons:'只有声音的人物',tags:'人物标签',persona:'身份阶段',split_emotions:'情绪',split_emotion_reason:'情绪原因',split_intonation:'语调',split_av_sync:'音画同步',split_audio_events:'声音',after_line_id:'出现位置'});

const effRole=c=>c?.role_id||'role_'+c?.story_character_id;// contract section 9

const FACE_OPEN=/^field-G1-face_observations-(\d+)(?:$|-(?!claims-))/;
// Page state: open split panel (person id), open "其他" speaker list (field path), extra special-state input ('segment:person'),
// face whose menu is open (people), person whose 更多 is open, open cast editor ('segment:person'), line under the playhead.
let aSplit=null,aAddrAdd=null,aMore=null,aTile=null,aMoreP=null,aNow=null;

// The page of an episode second: the segment it falls in (before the first: the first, after the last: the last); no time: 收尾.
function segAt(t){const segs=doc('G3')?.segments||[];if(t==null||t===''||!Number.isFinite(Number(t))||!segs.length)return 'submit';t=Number(t);let i=segs.findIndex(s=>t>=s.start&&t<s.end);if(i<0)i=t<segs[0].start?0:segs.length-1;return 'seg:'+i;}
const relTime=r=>{const ts=(Array.isArray(r?.evidence_refs)?r.evidence_refs:[]).map(x=>Number(x?.timestamp_seconds)).filter(Number.isFinite);return ts.length?Math.min(...ts):NaN;};

const HINT={people:'先认人：每行一个人物。看成员脸是不是同一个人（点脸：视频跳到它出现的地方，脸下方打开它的操作：✓ 是这个人、属于谁；每张脸穿哪套造型由各段“出场”自动带上），显示名，以及下面信息表里的每一项（性别、年龄段、戏份、人物标签、身份阶段、归类、正式姓名和它的把握、称谓、别名、误认/自称、稳定外观、置信度、造型、认定依据）对不对，空着的格子有就填、没有就空着；各脸写法不同的格子每张脸一行，可单独改，也可“统一成这条”；本集角色与关系放到收尾，看完全部段再核对。都看过再点“核对”。虚线框的脸要单独确认；人物下面是“只有声音的人物”（旁白、电话另一端等，没有脸），每人选性别、年龄段、戏份，写人物标签和身份阶段（没有就空着）后点“核对”；不属于人物的脸在最下面，看一眼归类即可。',

MODES.A={

 hint:new Proxy({},{get:(o,k)=>segIdx(k)>=0?HINT.seg:HINT[k]}),

 render:new Proxy({},{get:(o,k)=>k==='people'?renderPeople:k==='submit'?renderWrap:segIdx(k)>=0?()=>renderSeg(segIdx(k)):undefined}),
 // Faces and persons are checked on 认人; every G3 part of a segment, and each conclusion or relation, on the page of its time.
 stepOf(t,p){
  if(t==='G3')return p[0]==='segments'&&Number.isInteger(p[1])?'seg:'+p[1]:p[0]==='split_audio_events'?soundStep(p[1]):'submit';

 help:'<p>本任务只做人物与对白，跟着视频走：① 认人 → 第 1…N 段 → 收尾。认人：每个人物一行，核对成员脸和它的信息表；每个人物选性别、年龄段、戏份，有正式姓名的再选姓名把握（确认：字幕、人名条或证件直接给出；候选：从称呼或上下文推断；未定：拿不准），没有正式姓名的不用选。人物下面的“只有声音的人物”是全集没有露脸、只听到声音的说话人（旁白、电话另一端、画外人群等），来自各段的“仅声音角色”：每人同样选性别、年龄段、戏份（按声音判断，听不出来选“未知”）；名字在它所在的那一段改；其实是名单里某个人物的声音，就在那一段把它对应到这个人物，它会从这里消失。每一段单独一页，像读剧本一样：顶部“出场”每人一行，直接点编号选本段穿哪套、填特殊状态（闪回、受伤等），下面按时间排着每句台词，结论和关系挂在它依据的台词下面（✓ 原话对上、≈ 按时间对上，看一眼；⚠ 要确认；✗ 必须重选或删掉）。整段播放过后点“本段核对完”，没有疑点的条目一起核对。收尾：先看人物小结，每个人物的本集角色与关系对照它最终的关系核对（这一项放在最后，因为要看完对白和关系才能判断）。快捷键（不在输入框里时）：空格 播放／暂停，↑↓ 上一句／下一句，1–9 设当前句的说话人。</p><p>年龄段按外貌选：儿童约 12 岁及以下，少年 13–17 岁，青年 18–35 岁，中年 36–59 岁，老年 60 岁及以上；看不出来选“未知”。</p><p>戏份：主演是本集故事围绕的人物；配角是其他有台词或推动剧情的剧情人物；群演是没有剧情作用的背景人物；旁白是只做旁白或解说、不参与剧情的人。</p><p>改了正式姓名，姓名把握要重新选，人物卡片也要重新核对。</p><p>每句台词选一个声音类型：正常、内心独白（心里想的话）、画外音（旁白、解说）、电话（电话或对讲另一端）、设备播放（电视、广播、录音）、耳语、环境混响（空旷处的回声）、变声（处理过的声音）、非人说话的声音（机器人、动物、怪物等不是人在说话）。本任务不填英文对白、说话阶段、ASR 关联和具体依据（自动生成），也不写剧情概述和每段剧情（在“剧情”页面标）。</p><p>人物标签：0–5 个简短的词，写人物的性格、身份或剧情作用（如“霸道总裁”“反派”“隐忍”“忠诚下属”），用顿号隔开；只写画面或台词里有依据的。主演和配角至少写一个，群演可以不写。身份阶段：只在这个人物本集有隐藏身份、伪装、冒充或身份转变时填，写名称（如“伪装成保安的继承人”）和一句话说明依据；没有就两项都空着。只有声音的人物同样填这两项。</p><p>每句台词还要标四项。情绪：1–3 个词（如“平静”“愤怒”），用顿号隔开。情绪原因：这句话为什么带这种情绪。语调：声音高低、快慢、轻重的特点（如“语速快，句末上扬”）。音画同步：匹配＝画面里说话人的嘴动和声音对得上；部分可判断＝只有一部分时间能看到嘴动来判断；不一致＝嘴动和声音对不上；无法判断＝说话人在画面里，但看不清嘴；不适用＝说话人不出镜，或是画外音、内心独白。</p><p>声音：音乐、音效（关门、脚步、打斗等）、环境声（风雨、人群、车流等）这些不是台词的声音。每条选类别、写是什么声音，排在它出现时刚说完的那句台词后面（在第一句台词之前的选“开头”）。机标漏掉的，播放到那里点“＋ 声音”；本来没有的点“删除”。</p><p>一句台词里其实有两个人说话：把这句的起止时间改成第一个人的部分，再点“＋ 在视频当前时间新增对白”给第二个人加一句。</p>',

 // A face's formal name drives the display name of every person that follows it (derived output, design 4.1); typing the

  if(shared?.length){const g1=clone(doc(t)),g3=has('G3')?clone(doc('G3')):null,keep=[];for(const i of [p[1],...shared])setIn(g1.face_observations[i],p.slice(2),v);

/* ---------- watching: which part of each segment has played (in this session), and the line under the playhead ---------- */
const aWatch=new Map();let aPrevT=null;
function watchBins(){const r=row(),D=Number(doc('G3')?.source_duration)||Number(r?.duration_s)||Number($('video').duration)||0;if(!r||!(D>0))return null;let w=aWatch.get(r.item_id);if(!w){w=new Uint8Array(Math.ceil(D*4)+8);aWatch.set(r.item_id,w);}return w;}
function markWatched(a,b){const w=watchBins();if(!w||!(b>a))return;for(let k=Math.max(0,Math.floor(a*4));k<Math.min(w.length,Math.ceil(b*4));k++)w[k]=1;}
function watched(i){const s=doc('G3')?.segments?.[i],w=watchBins();if(!s||!w)return 0;const a=Math.max(0,Math.floor(s.start*4)),b=Math.min(w.length,Math.ceil(s.end*4));let n=0;for(let k=a;k<b;k++)n+=w[k];return b>a?n/(b-a):0;}
function watchMeter(i){const v=Math.round(watched(i)*100);return '<span class="watch'+(v>=WATCH_MIN*100?' ok':'')+'" data-watch="'+i+'" title="本段已播放的比例；到 '+WATCH_MIN*100+'% 才能点“本段核对完”"><span class="wbar"><i style="width:'+v+'%"></i></span><span class="wtxt">已看 '+v+'%</span></span>';}
function updateWatch(){document.querySelectorAll('#form [data-watch]').forEach(el=>{const v=Math.round(watched(Number(el.dataset.watch))*100);el.querySelector('i').style.width=v+'%';el.querySelector('.wtxt').textContent='已看 '+v+'%';el.classList.toggle('ok',v>=WATCH_MIN*100);});}
// The current line: the last line starting at or before the playhead; while playing, the script keeps it in view.
function followLine(t){
 if(segIdx(state.step)<0)return;let cur=null;for(const el of document.querySelectorAll('#form .sline[data-at]')){if(Number(el.dataset.at)<=t+.05)cur=el;else break;}
 const key=cur?.dataset.line||null;if(key===aNow&&(!cur||cur.classList.contains('now')))return;aNow=key;
 document.querySelectorAll('#form .sline.now').forEach(x=>x.classList.remove('now'));if(!cur)return;cur.classList.add('now');
 if(!$('video').paused&&!$('form').contains(document.activeElement))cur.scrollIntoView({block:'nearest'});
}
document.addEventListener('timeupdate',e=>{if(e.target?.id!=='video')return;const v=e.target,t=v.currentTime;if(!v.paused&&!v.seeking&&aPrevT!=null&&t>aPrevT&&t-aPrevT<1.5)markWatched(aPrevT,t);aPrevT=v.paused||v.seeking?null:t;followLine(t);updateWatch();},true);
document.addEventListener('seeking',e=>{if(e.target?.id==='video')aPrevT=null;},true);
// Clicking a script line outside its controls makes it the current line (the video goes to its start).
document.addEventListener('click',e=>{const el=e.target.closest('#form .sline[data-at]');if(!el||e.target.closest('input,textarea,select,button,a'))return;seek(Number(el.dataset.at));aNow=null;followLine(Number(el.dataset.at));});
// Keys on a segment page while not typing: ↑/↓ previous/next line (the video goes there), 1–9 the current line's speaker.
document.addEventListener('keydown',e=>{
 if(segIdx(state.step)<0||e.isComposing||e.ctrlKey||e.metaKey||e.altKey||e.target.closest('input,textarea,select,[contenteditable],dialog'))return;
 const list=[...document.querySelectorAll('#form .sline[data-at]')],k=list.findIndex(x=>x.dataset.line===aNow);
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){const to=list[k<0?0:k+(e.key==='ArrowDown'?1:-1)];if(to){e.preventDefault();seek(Number(to.dataset.at));aNow=null;followLine(Number(to.dataset.at));to.scrollIntoView({block:'nearest'});}}
 else if(/^[1-9]$/.test(e.key)&&k>=0){const [i,j]=aNow.split(':').map(Number),o=segPeople(i).near[Number(e.key)-1];if(!o)return;e.preventDefault();const p=['segments',i,'dialogue',j];state.editKeys=[['G3',null,p]];const res=commit('G3',[...p,'speaker_role_id'],o.v);if(res.changed){afterEdit(true);message('说话人设为 '+o.label+'（可撤销）。');}}
});

function onValue(e){
 const el=e.target;if(!el.matches('[data-path][data-value-type]')||!row())return;
 const p=JSON.parse(el.dataset.path),t=el.dataset.task;
 if(el.type==='number'&&needsRender(t,p)&&e.type==='input')return;// these numbers apply on change so partial typing is kept
 let v=el.value;
 if(el.dataset.valueType==='strings')v=v.split(/\r?\n/).filter(s=>s.trim());
 else if(el.dataset.valueType==='semi')v=v.split(/[；;\n]+/).map(s=>s.trim()).filter(Boolean);// one line, items separated by ；
 else if(el.dataset.valueType==='numbers')v=v.split(/\r?\n/).filter(s=>s.trim()).map(Number);
 else if(el.dataset.valueType==='number')v=v===''?null:r3(Number(v)-(Number(el.dataset.offset)||0));
 else if(el.dataset.valueType==='boolean')v=v===''?null:v==='true';
 else if(el.dataset.valueType==='enum')v=v==='__unfilled__'?null:JSON.parse(v);
 else if(el.dataset.emptyNull&&!v.trim())v=null;// a blank name or role is the prompt's null, no extra tick needed
 const result=commit(t,p,v);if(!result.changed)return;
 el.closest('.field')?.classList.add('changed');
 // While typing, re-rendering would move the caret: dependent updates wait for the field's change (blur).
 const typing=e.type==='input'&&(el.tagName==='TEXTAREA'||el.type==='text');
 if(result.rerender&&typing){state.renderOnChange=true;afterEdit(false);}else afterEdit(result.rerender);
}

 if(el.matches('[data-name-bind]')){const x=JSON.parse(el.dataset.nameBind),obj=clone(at(doc(x.t),x.path))||{},v=el.value;if(!v)return;

async function submitAssignedEpisode(job,episode){
 const operator=state.operator;
 const fileName=FILE_PREFIX+'-结果-'+episode.item_id+'.json';
 const resultJson=JSON.stringify(C.exportRows([episode]));
 const response=await fetch('/api/annotator/results',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  signal:AbortSignal.timeout(20000),
  body:JSON.stringify({batchId:job.batchId,task:job.task,mode:'primary',operator,
   resultJson,timingCsv:workLog(fileName,operator,[episode]),fileName,directSubmit:true}),
 });
 if(response.status===401)throw Error('登录已过期，请重新登录后重试');
 const result=await response.json().catch(()=>null);
 if(!response.ok||!result?.itemIds?.includes(episode.item_id))throw Error(result?.error||'暂时无法提交，请重试');
 job.submitted.add(episode.item_id);
}
$('complete').onclick=async()=>{
 const episode=row(),job=state.directJob;
 if(!episode||(!job&&!state.submitReview)||$('complete').disabled||job?.submitting||job?.submitted.has(episode.item_id))return;
 try{
  if(state.submitReview&&C.roundOf(episode).role==='qc'&&episode.prompt_g_review?.verdict?.verdict==='return'){
   await state.submitReview({returnOnly:true});
   return;
  }
  if(g3Blocked())return message('本集缺少镜头标注所需的资料，请联系管理员。',true);

   return;
  }
  const result=C.complete(episode,state.operator);
  if(!result.ok){
   refreshIssues();state.showProblems=true;markIssues();
   const questions=result.hard.filter(issue=>issue.path==='review.problem');
   const roundIssue=result.hard.find(issue=>issue.path==='review.round');
   message(questions.length?'还有 '+questions.length+' 个未解决的疑问，请处理后点“问题已解决”。':roundIssue?'质检：'+roundIssue.message:'还有阻塞问题，请先修正。',true);
   return;
  }
  if(state.submitReview){
   scheduleSave();
   await state.submitReview();
   return;
  }
  job.submitting=true;
  renderStatus();
  scheduleSave();
  try{await submitAssignedEpisode(job,episode);}
  catch(e){
   const detail=e.name==='TimeoutError'?'连接超时，请重试':e instanceof TypeError?'请检查网络后重试':e.message;
   message('提交失败。'+detail,true);
   return;
  }finally{
   job.submitting=false;
   renderStatus();
  }
  renderQueue();
  if(row()===episode){
   const pending=r=>!job.submitted.has(r.item_id);
   const later=state.rows.findIndex((r,i)=>i>state.index&&pending(r));
   const next=later>=0?later:state.rows.findIndex(pending);
   if(next>=0){state.step=STEPS[0][0];selectRow(next);}
  }
  message(job.submitted.size===state.rows.length?'本批作业已全部提交':'本集已提交');
 }catch(e){message(e.message,true);}
};

MODES.A.help="<h3>人物置信度：大致把握即可，不必逐条校准</h3><p>人物置信度大致表示对人物识别结果的把握，范围 0–1，不要求精确区分小数差异。原分数合理就保留：模型给出的 0.9、0.82 等都可以，不必因为能认出就改成 1。都能辨认清楚时，也可以按自己的试标习惯统一为 0.9 左右；保留原值或统一填写均可，不强制采用某个分值或分档，不要求为了统一数字而逐条改分。</p><p>重点核对有没有认错人或确实拿不准。画面模糊、侧脸或遮挡，但结合本集材料能认出是谁，不必刻意降分；不知道正式姓名或拿不准字形，另在姓名和“姓名把握”中记录。确实不确定时写清具体疑问，分数可按实际把握调整，不强制改为 0.5 或其他指定值。</p><p>明确不是这个角色，是归属错误：在该脸的“属于”中改到正确人物；确为另一个人物且名单中没有时，选“单独成为新人物”。暂不知道应归谁，先移到“不属于任何人物”并记疑问。不要仅给低分而留在错误人物名下，也不要把真实的另一个人标成“误检”。同一编号混了不同人物时，先移出错误归属并记录各处时间和实际人物，不能整组强行认成同一人。</p><p>目标人脸编号与视频中的实际对象无法可靠对应时，按页面已有的“未可靠定位／无法确认”处理，写明原因，不保留猜测的姓名、角色及不成立的结论。模糊但能可靠认出是谁，不属于这种情况。本次更新不会批量改写原有分数。</p><h3>姓名、称谓和别名</h3><p>正式姓名填人物在故事中的姓名，有依据的候选也可以填；称谓是按职务、身份、辈分或关系叫他的方式，如“江总”“大哥”；别名是同一人物实际使用的其他名字、小名或化名。只被别人提到的人名，不能自动归给镜头中的人物。</p><p>没有台词字幕不等于姓名全部留空。“姓名把握”选确认：本集清晰文字明确给出字形，并能对应到这个人；选候选：由听得清的自我介绍、称呼或上下文支持，但没有字形确证；选未定：名字或归属还拿不准。机标名字、ASR 和高置信度都不是确认依据。称谓与别名同样要有本集证据。</p><p>像“静琬／静婉”只听声音不能定字形：正式姓名不任选同音字，留空；在“冲突与不足”或待确认事项写“姓名字形待确认：听音 jing wan，00:12.3，被某人当面呼唤”。显示名可用可区分的外观或身份描述继续标。听不清就写听不清，不编拼音；不把拼音、问号或备选字串当成正式姓名。</p><p>本批只用下发材料作标注证据，不自行搜索演员表、百科或其他剧集补姓名；确需补充资料时，记录疑问交项目对接人统一提供可核查材料。原来已有姓名也要核对，不因预填了就选确认。</p>"+MODES.A.help;

async function loadAssignedJob(batchId,assignment,requestedItem){
 document.body.classList.add('loading-job');
 message('正在载入分配给你的任务…');
 try{
  if(!batchId||assignment!=='primary')throw Error('作业链接不完整，请从「我的任务」重新打开。');
  const task='people';
  const query=new URLSearchParams({batchId,task,mode:assignment});
  const fetchOptions={cache:'no-store',signal:AbortSignal.timeout(20000)};
  const account=await fetch('/api/auth/me',fetchOptions);
  if(!account.ok)throw Error(account.status===401?'登录已过期，请返回工作台重新登录。':'暂时无法读取账号，请刷新重试。');
  const {user}=await account.json();
  const [response,jobsResponse]=await Promise.all([
   fetch('/api/annotator/data?'+query,fetchOptions),
   fetch('/api/annotator/jobs',fetchOptions),
  ]);
  if(!response.ok){
   if(response.status===401)throw Error('登录已过期，请返回工作台重新登录。');
   const failure=await response.json().catch(()=>null);
   throw Error(failure?.error||'暂时无法载入任务，请刷新重试。');
  }
  const {parsed,lost}=await parseTaskData(await response.text());
  const name=batchId+'-'+task+'-'+assignment+'-'+parsed.rows.length+'.jsonl';
  const itemIds=rows=>rows.map(item=>item.item_id).sort();
  const key=STORE+':assigned:'+JSON.stringify([user.id,TASK,batchId,assignment,itemIds(parsed.rows)]);
  const saved=await AnnotationBatchStore.load(key).catch(()=>null);
  let current=parsed;
  if(saved){
   current=C.parse(JSON.stringify(saved),TASK);
   if(!current.draft||JSON.stringify(itemIds(current.rows))!==JSON.stringify(itemIds(parsed.rows))){
    throw Error('浏览器里的草稿与这次分配不一致。');
   }
  }
  if(!jobsResponse.ok)throw Error('暂时无法读取提交进度，请刷新重试。');
  const {jobs}=await jobsResponse.json();
  const job=jobs.find(j=>j.batch_id===batchId&&j.task===task&&j.mode===assignment);
  if(!job)throw Error('该作业没有分配给你。');
  const submitted=new Set(job.items.filter(item=>item.status==='submitted').map(item=>item.item_id));
  const directJob={batchId,task,submitted,submitting:false};
  if(!requestedItem&&submitted.has(current.rows[current.cursor||0]?.item_id)){
   const next=current.rows.findIndex(r=>!submitted.has(r.item_id));
   if(next>=0){current.cursor=next;current.ui=undefined;}
  }
  if(requestedItem){
   const index=current.rows.findIndex(item=>item.item_id===requestedItem);
   if(index<0)throw Error('该剧集不在你的分配范围内。');
   if(index!==current.cursor)current.ui=undefined;
   current.cursor=index;
  }
  state.directJob=directJob;
  setRows(current,name,current.ui,key);
  state.assignment=assignment;
  state.operator=user.display_name;
  $('saved').textContent=saved?'已恢复此浏览器草稿':'草稿保存在此浏览器';
  if(lost&&!saved)message(lost,true);
  else $('message').hidden=true;
 }catch(e){
  message('无法打开任务：'+(e.name==='TimeoutError'?'载入超时，请刷新重试。':e.message),true);
 }finally{
  document.body.classList.remove('loading-job');
 }
}
